<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본 주요 섬 · 지방 · 도도부현</title>
<style>
  :root {
    --paper: #f6f3ec;
    --ink: #21262f;
    --ink-soft: #5a6472;
    --rule: #cfc8ba;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 18px 40px;
    background: var(--paper);
    color: var(--ink);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  .eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: .28em;
    color: var(--ink-soft); text-transform: uppercase; margin: 0 0 10px;
  }
  h1 { font-size: clamp(22px, 4.6vw, 34px); font-weight: 800; letter-spacing: -.02em; margin: 0 0 8px; }
  h1 .jp { font-weight: 500; color: var(--ink-soft); font-size: .62em; margin-left: .5em; letter-spacing: 0; }
  .lede { font-size: 14px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 6px; max-width: 62ch; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 18px 0 4px; }
  svg { width: 100%; height: auto; display: block; }

  .tile rect { transition: transform .12s ease, filter .12s ease; }
  .tile { cursor: default; outline: none; }
  .tile:hover rect, .tile:focus rect { filter: brightness(1.07) saturate(1.15); stroke-width: 2.6; }
  .nm { font-size: 12px; font-weight: 700; fill: #1b1f26; text-anchor: middle; }
  .bd { font-size: 10px; font-weight: 700; fill: #1b1f26; opacity: .78; text-anchor: middle; }
  .tile rect { stroke-width: 1.4; }
    .hok rect { fill: #96b9d0; stroke: #4a7d97; }
    .toh rect { fill: #9fc9a8; stroke: #4c8158; }
    .kan rect { fill: #f0c76c; stroke: #a97f22; }
    .chu rect { fill: #b3aede; stroke: #635aa4; }
    .kin rect { fill: #f0a19c; stroke: #b1544f; }
    .cgk rect { fill: #9ccfc4; stroke: #428379; }
    .shi rect { fill: #e0c977; stroke: #9a832b; }
    .kyu rect { fill: #e7a5be; stroke: #a9587a; }

  .isle { fill: none; stroke: #6b7481; stroke-width: 2; stroke-dasharray: 7 5; }
  .islbl { font-size: 13px; font-weight: 800; fill: #3c4450; text-anchor: middle; }
  .lg { font-size: 12.5px; fill: var(--ink); }
  .lgn { font-size: 12.5px; font-weight: 700; fill: var(--ink-soft); text-anchor: end; }
  .lgh { font-size: 12px; font-weight: 800; fill: var(--ink); letter-spacing: .06em; }
  .note { font-size: 11.5px; fill: var(--ink-soft); }

  #info {
    margin-top: 14px; border: 1px solid var(--rule); border-radius: 10px;
    background: #fffdf8; padding: 14px 16px; min-height: 62px;
  }
  #info .ttl { font-size: 16px; font-weight: 800; }
  #info .meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #info .city { font-size: 13px; margin-top: 8px; }
  #info .hint { font-size: 13px; color: var(--ink-soft); }
</style>
</head>

<script>
  var info = document.getElementById('info');
  var idle = info.innerHTML;
  function show(g) {
    info.innerHTML =
      '<div class="ttl">' + g.dataset.name + '</div>' +
      '<div class="meta">' + g.dataset.region + ' · ' + g.dataset.island + '</div>' +
      '<div class="city">주요 도시 — ' + g.dataset.cities + '</div>';
  }
  document.querySelectorAll('.tile').forEach(function (g) {
    g.addEventListener('mouseenter', function () { show(g); });
    g.addEventListener('focus', function () { show(g); });
    g.addEventListener('click', function () { show(g); });
    g.addEventListener('mouseleave', function () { info.innerHTML = idle; });
  });
</script>
